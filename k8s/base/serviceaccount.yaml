# Xid-R Agent ServiceAccount
# Used by the agent to interact with the Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xidr-agent
  namespace: xidr-system
  labels:
    app.kubernetes.io/name: xidr
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: xidr-system
  annotations:
    # For Workload Identity (GKE)
    # iam.gke.io/gcp-service-account: xidr-agent@PROJECT_ID.iam.gserviceaccount.com
