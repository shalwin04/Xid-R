# Kustomization for Xid-R Agent
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: xidr-agent

namespace: xidr-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: xidr
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/managed-by: kustomize

# Image customization
images:
  - name: gcr.io/xidr-prod/xidr-agent
    newTag: latest
