# Xid-R Agent Secrets
# Contains sensitive configuration values
# NOTE: In production, use external secret management (GCP Secret Manager, Vault, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: xidr-agent-secrets
  namespace: xidr-system
  labels:
    app.kubernetes.io/name: xidr
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: xidr-system
type: Opaque
stringData:
  # Organization and cluster identifiers (set during installation)
  XIDR_ORGANIZATION_ID: "${ORGANIZATION_ID}"
  XIDR_CLUSTER_ID: "${CLUSTER_ID}"

  # API authentication token (generated during onboarding)
  XIDR_API_TOKEN: "${API_TOKEN}"

  # Encryption key for local state (auto-generated if not provided)
  XIDR_ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
